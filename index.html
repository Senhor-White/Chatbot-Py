<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Chatbot | PY</title> 
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos para o vídeo de introdução */
        #video-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video-intro video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #video-intro.hidden {
            display: none;
        }

        #skip-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 10000;
            transition: background 0.3s;
            font-weight: bold;
        }

        #skip-button:hover {
            background: rgba(255, 255, 255, 1);
        }
    </style>
</head>

<body>

    <!-- Tela de vídeo de introdução -->
    <div id="video-intro">
        <video id="intro-video" autoplay muted playsinline>
            <source src="{{ url_for('static', filename='animation_intro.mp4') }}" type="video/mp4">
            
        </video>
        <button id="skip-button">Pular Intro</button>
    </div>

    <!-- Conteúdo principal do site -->
    <header>
        <h1>Chatbot | PY</h1>
    </header>

    <div class="tempo_agora">
        <h1> {{tempo_agora}} </h1>
    </div>

    <div class="container">
        <div id="resposta_chatbot">
            {% if resposta_final2 %}
                <p>🧑‍💻 Você: {{ pergunta_usuario_html }}</p>
                <h2>Resposta do Chatbot:</h2> 
                <p>🤖 Chatbot: {{ resposta_final2 }}</p>
            {% endif %}
        </div>
    </div>
    
    <form action="/chat/" method="post" class="chat-input-form">
        <div class="input-container">
            <input type="text" name="pergunta" placeholder="Digite sua mensagem..." required>
            <button type="submit">Enviar</button> 
        </div>
    </form>

    <script>
        const videoIntro = document.getElementById('video-intro');
        const introVideo = document.getElementById('intro-video');
        const skipButton = document.getElementById('skip-button');

        
        introVideo.addEventListener('ended', function() {
            videoIntro.classList.add('hidden');
        });

        
        skipButton.addEventListener('click', function() {
            videoIntro.classList.add('hidden');
        });
    </script>
    
</body>
</html>
